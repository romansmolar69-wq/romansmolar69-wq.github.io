<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Emblem / Shield -->
  <g transform="translate(10, 10)">
    <!-- Shield Background -->
    <path d="M 50,0 L 95,20 L 95,65 C 95,88 50,102 50,102 C 50,102 5,88 5,65 L 5,20 Z" fill="url(#grad1)" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 50,6 L 89,24 L 89,64 C 89,83 50,96 50,96 C 50,96 11,83 11,64 L 11,24 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    
    <!-- Academic Cap / Tech Symbol -->
    <!-- Mortarboard Cap -->
    <polygon points="50,28 76,40 50,52 24,40" fill="#ffffff" />
    <polygon points="50,31 71,40 50,49 29,40" fill="#1e3a8a" />
    
    <!-- Gear Tech Accent -->
    <circle cx="50" cy="68" r="14" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,2" />
    <circle cx="50" cy="68" r="7" fill="#ffffff" />

    <!-- Open Book base -->
    <path d="M 36,78 Q 50,73 64,78 L 64,81 Q 50,76 36,81 Z" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="125" y="44" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#1e3a8a" letter-spacing="1">
    МППК
  </text>
  <text x="125" y="68" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#0f172a">
    МУКАЧІВСЬКИЙ ПРОФЕСІЙНИЙ
  </text>
  <text x="125" y="87" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#2563eb">
    ПОЛІТЕХНІЧНИЙ КОЛЕДЖ
  </text>
  <text x="125" y="104" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="0.5">
    Офіційний розклад навчальних занять
  </text>
</svg>
